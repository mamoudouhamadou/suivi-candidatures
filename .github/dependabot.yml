# Dependabot ouvre automatiquement des pull requests quand une dépendance a une mise à jour
# (et surtout une faille de sécurité corrigée). La CI les teste avant qu'on les fusionne.
# Les mises à jour mineures sont regroupées pour éviter une avalanche de PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    groups:
      mineures: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      mineures: { update-types: [minor, patch] }

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: monthly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
