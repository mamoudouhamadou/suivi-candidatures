# Intégration continue (CI) : à chaque push et à chaque pull request,
# GitHub démarre des machines Linux neuves et vérifie que tout fonctionne.
# Si une étape échoue, le commit est marqué ❌ et on le voit avant de fusionner.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # bouton « Run workflow » dans l'onglet Actions

# Principe du moindre privilège : le workflow peut seulement LIRE le code.
permissions:
  contents: read

# Sur une pull request, un nouveau push annule l'exécution précédente encore en cours.
# Jamais sur main : on n'interrompt pas un déploiement en plein milieu.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------- API
  backend:
    name: API (types, tests, intégration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    # Un vrai PostgreSQL pour les tests d'intégration, sur le même port qu'en local (.env.test)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: suivi
          POSTGRES_PASSWORD: suivi_dev
          POSTGRES_DB: suivi_candidatures_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U suivi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm # réutilise le cache npm entre les exécutions (plus rapide)
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances (+ prisma generate)
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Tests d'intégration (migrations + PostgreSQL)
        run: npm run test:integration

      - name: Compiler
        run: npm run build

  # ---------------------------------------------------------- Interface
  frontend:
    name: Interface (types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Tests des composants
        run: npm test

      - name: Vérifier les types et compiler
        run: npm run build

  # ------------------------------------------ Application complète (Docker)
  docker:
    name: Docker (build + test de bout en bout)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend] # seulement si les deux premiers jobs ont réussi
    env:
      JWT_SECRET: secret-de-ci-qui-fait-au-moins-32-caracteres-de-long
    steps:
      - uses: actions/checkout@v7

      - name: Construire et démarrer les 4 services
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Test de bout en bout (via nginx)
        run: |
          set -euo pipefail
          URL=http://localhost:8080

          # La page et l'API répondent
          curl -fsS "$URL/" | grep -q '<div id="racine">'
          curl -fsS "$URL/api/sante" | grep -q '"ok"'

          # Inscription → jeton → création → liste
          JETON=$(curl -fsS -X POST "$URL/api/auth/inscription" \
            -H "Content-Type: application/json" \
            -d '{"courriel":"ci@exemple.test","motDePasse":"motdepasse-ci"}' | jq -r .jeton)
          curl -fsS -X POST "$URL/api/candidatures" \
            -H "Authorization: Bearer $JETON" -H "Content-Type: application/json" \
            -d '{"entreprise":"GitHub","poste":"Stagiaire"}' > /dev/null
          test "$(curl -fsS "$URL/api/candidatures" -H "Authorization: Bearer $JETON" | jq length)" = "1"

          # Sans jeton → 401 ; en-tête de sécurité présent
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/candidatures")" = "401"
          curl -fsSI "$URL/" | grep -qi "x-frame-options: DENY"
          echo "✅ Application complète fonctionnelle"

      - name: Journaux des conteneurs (en cas d'échec)
        if: failure()
        run: docker compose logs --no-color

      - name: Arrêter
        if: always()
        run: docker compose down -v

      - name: Image de déploiement (un seul conteneur API + interface)
        run: |
          set -euo pipefail
          docker build -t deploiement .
          # Démarrage sans base de données (mode mémoire) : on vérifie seulement que l'image fonctionne
          docker run -d --name deploiement -p 3000:3000 \
            -e JWT_SECRET="$JWT_SECRET" -e VERSION="${{ github.sha }}" deploiement
          for _ in $(seq 1 30); do curl -fsS http://localhost:3000/api/sante > /dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://localhost:3000/api/sante | jq -e '.version == "${{ github.sha }}"'
          curl -fsS http://localhost:3000/ | grep -q '<div id="racine">'
          docker rm -f deploiement

  # ------------------------------------------------- Déploiement continu (CD)
  # Seulement sur main, après TOUS les tests, et une fois l'hébergement configuré
  # (variable de dépôt DEPLOIEMENT_ACTIF = true ; voir docs/DEPLOIEMENT.md).
  deploy:
    name: Déploiement (Neon + Render)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOIEMENT_ACTIF == 'true'
    environment:
      name: production
      url: ${{ vars.URL_PRODUCTION }}
    concurrency:
      group: deploiement-production
      cancel-in-progress: false # un déploiement à la fois, jamais interrompu
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer le CLI Prisma
        working-directory: backend
        run: npm ci

      # Render (gratuit) ne peut pas lancer de commande avant un déploiement :
      # la CI applique donc les migrations sur la base de production (Neon) d'abord.
      - name: Appliquer les migrations (Neon)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Déclencher le déploiement (Render)
        env:
          CROCHET: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "${CROCHET}&ref=${{ github.sha }}" > /dev/null

      - name: Attendre la nouvelle version en ligne
        env:
          URL: ${{ vars.URL_PRODUCTION }}
        run: |
          # Render construit l'image (quelques minutes) ; on attend que /api/sante annonce ce commit.
          for i in $(seq 1 60); do
            VERSION=$(curl -fsS --max-time 60 "$URL/api/sante" 2>/dev/null | jq -r .version || true)
            if [ "$VERSION" = "${{ github.sha }}" ]; then
              echo "✅ Version ${{ github.sha }} en ligne : $URL"
              exit 0
            fi
            echo "Version en ligne : ${VERSION:-indisponible}… (essai $i/60)"
            sleep 20
          done
          echo "❌ La nouvelle version n'est pas en ligne après 20 minutes"
          exit 1

      - name: Test de fumée en production
        env:
          URL: ${{ vars.URL_PRODUCTION }}
        run: |
          set -euo pipefail
          curl -fsS "$URL/" | grep -q '<div id="racine">'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/candidatures")" = "401"
          echo "✅ Production fonctionnelle"
